<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-ONE // Ultron Command Center</title>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/index.min.js"></script>
    <style>
        :root {
            --bg-color: #02060d;
            --panel-bg: rgba(5, 12, 24, 0.9);
            --border-color: #00f0ff;
            --text-main: #00f0ff;
            --text-dim: #6b88a4;
            --accent-green: #00ff66;
            --accent-red: #ff3366;
            --accent-yellow: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at center, rgba(0, 240, 255, 0.08) 0%, transparent 70%),
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }

        /* Ultron Live Background Core Animation */
        .ultron-core-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            border: 2px dashed rgba(0, 240, 255, 0.15);
            border-radius: 50%;
            animation: rotateCore 20s linear infinite;
            pointer-events: none;
            z-index: -1;
        }

        .ultron-core-bg::after {
            content: '';
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 1px solid rgba(255, 51, 102, 0.1);
            border-radius: 50%;
            animation: rotateCoreRev 15s linear infinite;
        }

        @keyframes rotateCore {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes rotateCoreRev {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.1);
            padding: 20px;
            border-radius: 6px;
            backdrop-filter: blur(5px);
        }

        h2, h3 {
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        .subtitle {
            text-align: center;
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 20px;
            letter-spacing: 1.5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 11px;
            margin-bottom: 5px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-color);
            padding: 10px;
            color: var(--text-main);
            font-size: 14px;
            border-radius: 2px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        button {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            margin-top: 10px;
            border-radius: 2px;
        }

        button:hover:not(:disabled) {
            background: var(--border-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--border-color);
        }

        button:disabled {
            border-color: var(--text-dim);
            color: var(--text-dim);
            cursor: not-allowed;
            background: rgba(255,255,255,0.01);
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 10px;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 6px 3px;
            font-size: 9px;
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-dim);
            margin-top: 0;
            white-space: nowrap;
        }

        .tab-btn.active {
            border-color: var(--border-color);
            color: var(--text-main);
            background: rgba(0, 240, 255, 0.12);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        .status-box {
            padding: 12px;
            border: 1px dashed var(--border-color);
            text-align: center;
            font-size: 12px;
            margin-bottom: 15px;
            background: rgba(0, 240, 255, 0.04);
            letter-spacing: 1px;
        }

        .locked-container {
            position: relative;
            text-align: center;
            margin-top: 10px;
        }

        .lock-icon {
            font-size: 26px;
            margin-bottom: 5px;
        }

        .card-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 2px;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-accept {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .btn-accept:hover {
            background: var(--accent-green);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .btn-reject {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .btn-reject:hover {
            background: var(--accent-red);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--accent-red);
        }

        .danger-btn {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }
        .danger-btn:hover {
            background: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 10px var(--accent-red);
        }
    </style>
</head>
<body>

    <!-- Ultron Style Rotating Core Background -->
    <div class="ultron-core-bg"></div>

    <div class="container" id="app-container">
        <!-- Dynamic Content loads here -->
    </div>

    <script>
        // Initialize EmailJS
        (function(){
            emailjs.init("YOUR_PUBLIC_KEY"); 
        })();

        // Detect Device Info
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let device = "Unknown Node";
            if (/android/i.test(ua)) device = "Android Neural Node";
            else if (/iphone|ipad|ipod/i.test(ua)) device = "iOS Neural Node";
            else if (/win/i.test(ua)) device = "Windows Workstation";
            else if (/mac/i.test(ua)) device = "Mac Terminal";
            return `${device} (${navigator.platform})`;
        }

        function renderAuth() {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <h2>S-ONE // ULTRON CORE</h2>
                <div class="subtitle">Secure Gateway Access</div>
                <div class="form-group">
                    <label>Operative / Admin ID</label>
                    <input type="text" id="username" placeholder="Enter ID">
                </div>
                <div class="form-group">
                    <label>Neural Passcode</label>
                    <input type="password" id="password" placeholder="Enter Password">
                </div>
                <button onclick="handleLogin()">Establish Link</button>
            `;
        }

        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) {
                alert("ACCESS DENIED: Credentials required.");
                return;
            }

            // Retrieve stored Admin credentials or use defaults (admin / sone123)
            const currentAdminUser = localStorage.getItem('admin_username') || 'admin';
            const currentAdminPass = localStorage.getItem('admin_password') || 'sone123';

            if (user === currentAdminUser && pass === currentAdminPass) {
                localStorage.setItem('sone_role', 'admin');
                localStorage.setItem('sone_user', 'Admin Core');
                renderAdminDashboard('requests');
            } else {
                // Universal Guest Password check (default: 'guest123')
                const universalGuestPass = localStorage.getItem('universal_guest_password') || 'guest123';
                if (pass !== universalGuestPass) {
                    alert("ACCESS DENIED: Incorrect Passcode.");
                    return;
                }

                localStorage.setItem('sone_role', 'guest');
                localStorage.setItem('sone_user', user);

                if (!localStorage.getItem(`session_start_${user}`)) {
                    localStorage.setItem(`session_start_${user}`, Date.now());
                }

                if (!localStorage.getItem(`req_status_${user}`)) {
                    localStorage.setItem(`req_status_${user}`, 'idle');
                }
                renderGuestPortal('dashboard');
            }
        }

        // --- GUEST PORTAL ---
        function renderGuestPortal(activeTab = 'dashboard') {
            const username = localStorage.getItem('sone_user');
            const status = localStorage.getItem(`req_status_${username}`) || 'idle';
            const container = document.getElementById('app-container');

            let statusText = "Ready to transmit request.";
            if (status === 'waiting') statusText = "STATUS: WAITING FOR ADMIN APPROVAL...";
            else if (status === 'accepted') statusText = "STATUS: ACCESS GRANTED - DOWNLOAD UNLOCKED";
            else if (status === 'rejected') statusText = "STATUS: ACCESS DENIED BY ADMIN";

            container.innerHTML = `
                <h2>S-ONE TERMINAL</h2>
                <div class="subtitle">Operative: ${username}</div>
                
                <div class="tabs">
                    <button class="tab-btn ${activeTab === 'dashboard' ? 'active' : ''}" onclick="switchGuestTab('dashboard')">Dashboard</button>
                    <button class="tab-btn ${activeTab === 'sone' ? 'active' : ''}" onclick="switchGuestTab('sone')">S-ONE Core</button>
                </div>

                <!-- DASHBOARD TAB -->
                <div id="tab-dashboard" class="view-section ${activeTab === 'dashboard' ? 'active' : ''}">
                    <div class="status-box">${statusText}</div>
                    ${status === 'idle' ? `<button onclick="sendAccessRequest()">Request Send</button>` : ''}
                    ${status === 'waiting' ? `<button disabled>Request Pending...</button>` : ''}
                    <button class="danger-btn" onclick="logout()">Terminate Session</button>
                </div>

                <!-- S-ONE TAB -->
                <div id="tab-sone" class="view-section ${activeTab === 'sone' ? 'active' : ''}">
                    <div class="locked-container">
                        ${status !== 'accepted' ? `
                            <div class="lock-icon">🔒</div>
                            <div style="font-size:11px; color:var(--text-dim); margin-bottom:12px; letter-spacing:1px;">SECURE PACKAGE LOCKED</div>
                        ` : `
                            <div class="lock-icon" style="color:var(--accent-green);">🔓</div>
                            <div style="font-size:11px; color:var(--accent-green); margin-bottom:12px; letter-spacing:1px;">PACKAGE READY</div>
                        `}
                        <div class="status-box">${statusText}</div>
                        <button ${status !== 'accepted' ? 'disabled' : ''} onclick="downloadPackage()">Download Secure Package</button>
                    </div>
                    <button class="danger-btn" style="margin-top:20px;" onclick="logout()">Terminate Session</button>
                </div>
            `;
        }

        function switchGuestTab(tabName) {
            renderGuestPortal(tabName);
        }

        function sendAccessRequest() {
            const username = localStorage.getItem('sone_user');
            const device = getDeviceInfo();
            
            localStorage.setItem(`req_status_${username}`, 'waiting');
            localStorage.setItem(`device_${username}`, device);

            let pending = JSON.parse(localStorage.getItem('sone_pending_requests') || '[]');
            if(!pending.includes(username)) {
                pending.push(username);
                localStorage.setItem('sone_pending_requests', JSON.stringify(pending));
            }

            emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
                user_name: username,
                device_info: device,
                message: `New secure request from Operative ${username} using ${device}.`
            }).catch(err => console.log("Email sync active"));

            alert("Request transmitted to Ultron Core.");
            renderGuestPortal('dashboard');
        }

        function downloadPackage() {
            alert("Secure package downloaded successfully. Neural node active!");
            let activeNodes = JSON.parse(localStorage.getItem('sone_active_nodes') || '[]');
            const username = localStorage.getItem('sone_user');
            if(!activeNodes.includes(username)) {
                activeNodes.push(username);
                localStorage.setItem('sone_active_nodes', JSON.stringify(activeNodes));
            }
        }

        // --- ADMIN DASHBOARD ---
        function renderAdminDashboard(activeAdminTab = 'requests') {
            const container = document.getElementById('app-container');
            let pending = JSON.parse(localStorage.getItem('sone_pending_requests') || '[]');
            let activeNodes = JSON.parse(localStorage.getItem('sone_active_nodes') || '[]');
            
            let currentGuestPass = localStorage.getItem('universal_guest_password') || 'guest123';
            let currentAdminUser = localStorage.getItem('admin_username') || 'admin';
            let currentAdminPass = localStorage.getItem('admin_password') || 'sone123';

            // 1. Requests HTML
            let requestsHtml = '';
            if (pending.length === 0) {
                requestsHtml = '<div style="font-size:11px; color:var(--text-dim); text-align:center; margin-bottom:15px;">No pending security requests.</div>';
            } else {
                pending.forEach(user => {
                    let dev = localStorage.getItem(`device_${user}`) || 'Unknown Terminal';
                    requestsHtml += `
                        <div class="card-box">
                            <div style="font-weight:bold; color:var(--text-main);">${user}</div>
                            <div style="font-size:11px; color:var(--text-dim); margin-top:3px;">Device: ${dev}</div>
                            <div class="admin-actions">
                                <button class="btn-accept" onclick="adminAction('${user}', 'accepted')">Accept</button>
                                <button class="btn-reject" onclick="adminAction('${user}', 'rejected')">Reject</button>
                            </div>
                        </div>
                    `;
                });
            }

            // 2. Active Running Nodes HTML
            let nodesHtml = '';
            if (activeNodes.length === 0) {
                nodesHtml = '<div style="font-size:11px; color:var(--text-dim); text-align:center; margin-bottom:15px;">No active S-ONE nodes running.</div>';
            } else {
                activeNodes.forEach(user => {
                    let dev = localStorage.getItem(`device_${user}`) || 'Unknown Device';
                    nodesHtml += `
                        <div class="card-box">
                            <div style="font-weight:bold; color:var(--accent-green);">NODE: ${user}</div>
                            <div style="font-size:11px; color:var(--text-dim); margin-top:3px;">Device: ${dev}</div>
                            <button class="danger-btn" style="margin-top:8px; padding:6px;" onclick="killNode('${user}')">Kill Switch</button>
                        </div>
                    `;
                });
            }

            // 3. Credentials Control HTML (Guest Password & Admin Credentials)
            let credsHtml = `
                <div class="card-box">
                    <div style="font-weight:bold; color:var(--text-main); margin-bottom:5px;">Universal Guest Password</div>
                    <div class="form-group" style="margin-bottom:8px;">
                        <label style="font-size:10px;">Current: ${currentGuestPass}</label>
                        <input type="text" id="new_guest_pass" placeholder="Enter new password for all guests">
                    </div>
                    <button onclick="updateGuestPassword()">Update Guest Password</button>
                </div>

                <div class="card-box" style="margin-top:15px;">
                    <div style="font-weight:bold; color:var(--text-main); margin-bottom:5px;">Admin Credentials Control</div>
                    <div class="form-group" style="margin-bottom:8px;">
                        <label style="font-size:10px;">New Admin Username</label>
                        <input type="text" id="new_admin_user" placeholder="Enter new admin username" value="${currentAdminUser}">
                    </div>
                    <div class="form-group" style="margin-bottom:8px;">
                        <label style="font-size:10px;">New Admin Password</label>
                        <input type="text" id="new_admin_pass" placeholder="Enter new admin password" value="">
                    </div>
                    <button onclick="updateAdminCredentials()">Update Admin Profile</button>
                </div>
            `;

            // 4. Analytics HTML
            let sessionStart = localStorage.getItem(`session_start_guest`) || Date.now();
            let durationMins = Math.floor((Date.now() - sessionStart) / 60000);
            let analyticsHtml = `
                <div class="card-box">
                    <div style="font-weight:bold; margin-bottom:5px;">Telemetry Analytics</div>
                    <div style="font-size:11px; color:var(--text-dim
