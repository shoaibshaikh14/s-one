DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-ONE // Neural Command Interface</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/index.min.js"></script>
    <style>
        :root {
            --bg: #010409;
            --box-bg: #0d1117;
            --cyan: #00f0ff;
            --dim: #8b949e;
            --green: #2ea043;
            --red: #da3633;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--cyan);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .terminal-box {
            width: 100%;
            max-width: 450px;
            background: var(--box-bg);
            border: 1px solid var(--cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            padding: 25px;
            border-radius: 4px;
        }

        h2 {
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .sub-title {
            text-align: center;
            font-size: 11px;
            color: var(--dim);
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 11px;
            margin-bottom: 5px;
            color: var(--dim);
            text-transform: uppercase;
        }

        input {
            width: 100%;
            background: #010409;
            border: 1px solid var(--cyan);
            padding: 12px;
            color: var(--cyan);
            font-size: 14px;
            border-radius: 2px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }

        .btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn:hover:not(:disabled) {
            background: var(--cyan);
            color: var(--bg);
        }

        .btn:disabled {
            border-color: var(--dim);
            color: var(--dim);
            cursor: not-allowed;
        }

        .tabs-nav {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 10px;
        }

        .tab-item {
            flex: 1;
            padding: 8px 4px;
            font-size: 10px;
            background: transparent;
            border: 1px solid var(--dim);
            color: var(--dim);
            text-align: center;
            cursor: pointer;
            text-transform: uppercase;
        }

        .tab-item.active {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(0, 240, 255, 0.1);
        }

        .pane {
            display: none;
        }

        .pane.active {
            display: block;
        }

        .info-card {
            background: #010409;
            border: 1px solid var(--cyan);
            padding: 12px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .status-display {
            padding: 15px;
            border: 1px dashed var(--cyan);
            text-align: center;
            font-size: 12px;
            margin-bottom: 15px;
            background: rgba(0, 240, 255, 0.05);
        }

        .btn-green { border-color: var(--green); color: var(--green); }
        .btn-green:hover { background: var(--green) !important; color: #fff !important; }

        .btn-red { border-color: var(--red); color: var(--red); }
        .btn-red:hover { background: var(--red) !important; color: #fff !important; }

        .reset-link {
            text-align: center;
            margin-top: 12px;
            font-size: 10px;
            color: var(--dim);
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="terminal-box" id="app-root">
        <!-- Core content dynamically loads here -->
    </div>

    <script>
        // Initialize EmailJS with your real Public Key
        try { 
            emailjs.init("a6TAFnxtb-tQybqOo"); //[span_0](start_span)[span_0](end_span)
        } catch(e) {
            console.log("EmailJS init failed");
        }

        // Device Detector
        function getDevice() {
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) return "Android Neural Node";
            if (/iphone|ipad|ipod/i.test(ua)) return "iOS Neural Node";
            if (/win/i.test(ua)) return "Windows Workstation";
            return "Generic Terminal";
        }

        // Boot Controller
        window.onload = function() {
            routeSession();
        };

        function routeSession() {
            const role = localStorage.getItem('sone_role');
            if (role === 'admin') {
                loadAdminPanel('requests');
            } else if (role === 'guest') {
                loadGuestPortal('dashboard');
            } else {
                loadAuthScreen();
            }
        }

        // 1. AUTH SCREEN
        function loadAuthScreen() {
            document.getElementById('app-root').innerHTML = `
                <h2>S-ONE // CORE</h2>
                <div class="sub-title">Secure Enterprise Gateway</div>
                <div class="field">
                    <label>Operative / Admin ID</label>
                    <input type="text" id="usr" placeholder="Enter ID">
                </div>
                <div class="field">
                    <label>Neural Passcode</label>
                    <input type="password" id="pwd" placeholder="Enter Password">
                </div>
                <button class="btn" onclick="verifyLogin()">Establish Link</button>
                <div class="reset-link" onclick="triggerForgotPassword()">[ Forgot Password via Gmail ]</div>
                <div class="reset-link" onclick="systemHardReset()" style="color:var(--red);">[ Force System Reset ]</div>
            `;
        }

        function verifyLogin() {
            const u = document.getElementById('usr').value.trim();
            const p = document.getElementById('pwd').value.trim();

            if (!u || !p) {
                alert("ERROR: Credentials mandatory.");
                return;
            }

            const adminUser = localStorage.getItem('cfg_admin_usr') || 'admin';
            const adminPass = localStorage.getItem('cfg_admin_pwd') || 'sone123';
            const guestPass = localStorage.getItem('cfg_guest_pwd') || 'guest123';

            if (u === adminUser && p === adminPass) {
                localStorage.setItem('sone_role', 'admin');
                loadAdminPanel('requests');
            } else {
                if (p !== guestPass) {
                    alert("ACCESS DENIED: Invalid Passcode.");
                    return;
                }
                localStorage.setItem('sone_role', 'guest');
                localStorage.setItem('sone_user', u);
                if (!localStorage.getItem(`status_${u}`)) {
                    localStorage.setItem(`status_${u}`, 'idle');
                }
                loadGuestPortal('dashboard');
            }
        }

        // Forgot Password via Gmail Logic
        function triggerForgotPassword() {
            const adminUser = localStorage.getItem('cfg_admin_usr') || 'admin';
            const adminPass = localStorage.getItem('cfg_admin_pwd') || 'sone123';
            const targetEmail = "shoaibshaikh14062008@gmail.com"; //[span_1](start_span)[span_1](end_span)

            if(confirm(`Send recovery credentials to registered admin email (${targetEmail})?`)) {
                emailjs.send("shoaib1406", "template_mrkffeo", { //[span_2](start_span)[span_2](end_span)[span_3](start_span)[span_3](end_span)
                    name: "Admin Recovery", //[span_4](start_span)[span_4](end_span)
                    email: targetEmail, //[span_5](start_span)[span_5](end_span)
                    title: "S-ONE Password Recovery", //[span_6](start_span)[span_6](end_span)
                    message: `SECURITY ALERT: Your Admin Username is '${adminUser}' and current Neural Passcode is '${adminPass}'.` //[span_7](start_span)[span_7](end_span)
                }).then(function(response) {
                    alert("Recovery instructions dispatched to your Gmail inbox!");
                }, function(error) {
                    alert("Failed to send email. Check connection.");
                });
            }
        }

        // 2. GUEST PORTAL
        function loadGuestPortal(tab) {
            const user = localStorage.getItem('sone_user') || 'Operative';
            const status = localStorage.getItem(`status_${user}`) || 'idle';

            let statusMsg = "System Ready. Transmit request for clearance.";
            if (status === 'waiting') statusMsg = "STATUS: WAITING FOR ADMIN APPROVAL...";
            else if (status === 'accepted') statusMsg = "STATUS: ACCESS GRANTED - DOWNLOAD UNLOCKED";
            else if (status === 'rejected') statusMsg = "STATUS: ACCESS DENIED BY ADMIN";

            document.getElementById('app-root').innerHTML = `
                <h2>S-ONE TERMINAL</h2>
                <div class="sub-title">Operative: ${user}</div>

                <div class="tabs-nav">
                    <div class="tab-item ${tab === 'dashboard' ? 'active' : ''}" onclick="loadGuestPortal('dashboard')">Dashboard</div>
                    <div class="tab-item ${tab === 'sone' ? 'active' : ''}" onclick="loadGuestPortal('sone')">S-ONE Core</div>
                </div>

                <div class="pane ${tab === 'dashboard' ? 'active' : ''}">
                    <div class="status-display">${statusMsg}</div>
                    ${status === 'idle' ? `<button class="btn" onclick="sendRequest()">Request Send</button>` : ''}
                    ${status === 'waiting' ? `<button class="btn" disabled>Request Pending...</button>` : ''}
                    <button class="btn btn-red" style="margin-top:15px;" onclick="doLogout()">Terminate Session</button>
                </div>

                <div class="pane ${tab === 'sone' ? 'active' : ''}">
                    <div style="text-align:center; margin-bottom:15px;">
                        ${status !== 'accepted' ? '<div style="font-size:24px;">🔒</div><div style="font-size:11px; color:var(--dim);">PACKAGE LOCKED</div>' : '<div style="font-size:24px; color:var(--green);">🔓</div><div style="font-size:11px; color:var(--green);">PACKAGE READY</div>'}
                    </div>
                    <div class="status-display">${statusMsg}</div>
                    <button class="btn" ${status !== 'accepted' ? 'disabled' : ''} onclick="downloadAction()">Download Secure Package</button>
                    <button class="btn btn-red" style="margin-top:15px;" onclick="doLogout()">Terminate Session</button>
                </div>
            `;
        }

        function sendRequest() {
            const user = localStorage.getItem('sone_user');
            const dev = getDevice();

            localStorage.setItem(`status_${user}`, 'waiting');
            localStorage.setItem(`dev_${user}`, dev);

            let pending = JSON.parse(localStorage.getItem('queue_pending') || '[]');
            if (!pending.includes(user)) {
                pending.push(user);
                localStorage.setItem('queue_pending', JSON.stringify(pending));
            }

            emailjs.send("shoaib1406", "template_mrkffeo", { //[span_8](start_span)[span_8](end_span)[span_9](start_span)[span_9](end_span)
                name: user, //[span_10](start_span)[span_10](end_span)
                email: "shoaibshaikh14062008@gmail.com", //[span_11](start_span)[span_11](end_span)
                title: "New S-ONE Access Request", //[span_12](start_span)[span_12](end_span)
                message: `Operative ID: ${user} | Device: ${dev}` //[span_13](start_span)[span_13](end_span)
            });

            alert("Request transmitted to Ultron Core & Email dispatched.");
            loadGuestPortal('dashboard');
        }

        function downloadAction() {
            alert("Download initiated. Neural node active!");
            const user = localStorage.getItem('sone_user');
            let nodes = JSON.parse(localStorage.getItem('active_nodes') || '[]');
            if (!nodes.includes(user)) {
                nodes.push(user);
                localStorage.setItem('active_nodes', JSON.stringify(nodes));
            }
        }

        // 3. ADMIN PANEL
        function loadAdminPanel(tab) {
            const pending = JSON.parse(localStorage.getItem('queue_pending') || '[]');
            const nodes = JSON.parse(localStorage.getItem('active_nodes') || '[]');
            const curGuestPwd = localStorage.getItem('cfg_guest_pwd') || 'guest123';
            const curAdminUsr = localStorage.getItem('cfg_admin_usr') || 'admin';

            let reqHtml = '';
            if (pending.length === 0) {
                reqHtml = '<div style="font-size:11px; color:var(--dim); text-align:center;">No pending requests.</div>';
            } else {
                pending.forEach(u => {
                    let d = localStorage.getItem(`dev_${u}`) || 'Unknown Device';
                    reqHtml += `
                        <div class="info-card">
                            <div><b>Operative:</b> ${u}</div>
                            <div style="font-size:10px; color:var(--dim); margin:4px 0;">Device: ${d}</div>
                            <div style="display:flex; gap:8px; margin-top:8px;">
                                <button class="btn btn-green" style="margin:0; padding:6px;" onclick="handleDecision('${u}', 'accepted')">Accept</button>
                                <button class="btn btn-red" style="margin:0; padding:6px;" onclick="handleDecision('${u}', 'rejected')">Reject</button>
                            </div>
                        </div>
                    `;
                });
            }

            let nodesHtml = '';
            if (nodes.length === 0) {
                nodesHtml = '<div style="font-size:11px; color:var(--dim); text-align:center;">No active nodes running.</div>';
            } else {
                nodes.forEach(u => {
                    let d = localStorage.getItem(`dev_${u}`) || 'Unknown Device';
                    nodesHtml += `
                        <div class="info-card">
                            <div style="color:var(--green);"><b>Node:</b> ${u}</div>
                            <div style="font-size:10px; color:var(--dim); margin:4px 0;">Device: ${d}</div>
                            <button class="btn btn-red" style="margin-top:6px; padding:6px;" onclick="killNodeAction('${u}')">Kill Switch</button>
                        </div>
                    `;
                });
            }

            document.getElementById('app-root').innerHTML = `
                <h2>Admin Command</h2>
                <div class="sub-title">Central Neural Manager</div>

                <div class="tabs-nav">
                    <div class="tab-item ${tab === 'requests' ? 'active' : ''}" onclick="loadAdminPanel('requests')">Requests</div>
                    <div class="tab-item ${tab === 'nodes' ? 'active' : ''}" onclick="loadAdminPanel('nodes')">Nodes</div>
                    <div class="tab-item ${tab === 'security' ? 'active' : ''}" onclick="loadAdminPanel('security')">Security</div>
                </div>

                <div class="pane ${tab === 'requests' ? 'active' : ''}">
                    <div style="font-size:11px; color:var(--dim); margin-bottom:10px; text-transform:uppercase;">Access Clearances</div>
                    ${reqHtml}
                </div>

                <div class="pane ${tab === 'nodes' ? 'active' : ''}">
                    <div style="font-size:11px; color:var(--dim); margin-bottom:10px; text-transform:uppercase;">Running Terminals</div>
                    ${nodesHtml}
                </div>

                <div class="pane ${tab === 'security' ? 'active' : ''}">
                    <div class="info-card">
                        <div style="margin-bottom:5px;"><b>Universal Guest Password</b></div>
                        <input type="text" id="set_g_pwd" placeholder="New guest password" value="${curGuestPwd}" style="margin-bottom:8px;">
                        <button class="btn" style="margin:0; padding:8px;" onclick="saveGuestPwd()">Update Guest Password</button>
                    </div>
                    <div class="info-card" style="margin-top:15px;">
                        <div style="margin-bottom:5px;"><b>Admin Credentials</b></div>
                        <input type="text" id="set_a_usr" placeholder="New Admin ID" value="${curAdminUsr}" style="margin-bottom:8px;">
                        <input type="text" id="set_a_pwd" placeholder="New Admin Password" style="margin-bottom:8px;">
                        <button class="btn" style="margin:0; padding:8px;" onclick="saveAdminCreds()">Update Admin Profile</button>
                    </div>
                </div>

                <button class="btn btn-red" style="margin-top:20px;" onclick="doLogout()">Disconnect Core</button>
            `;
        }

        function handleDecision(user, decision) {
            localStorage.setItem(`status_${user}`, decision);
            let pending = JSON.parse(localStorage.getItem('queue_pending') || '[]');
            pending = pending.filter(x => x !== user);
            localStorage.setItem('queue_pending', JSON.stringify(pending));
            loadAdminPanel('requests');
        }

        function killNodeAction(user) {
            localStorage.setItem(`status_${user}`, 'rejected');
            let nodes = JSON.parse(localStorage.getItem('active_nodes') || '[]');
            nodes = nodes.filter(x => x !== user);
            localStorage.setItem('active_nodes', JSON.stringify(nodes));
            loadAdminPanel('nodes');
        }

        function saveGuestPwd() {
            const val = document.getElementById('set_g_pwd').value.trim();
            if (!val) { alert("Field cannot be empty"); return; }
            localStorage.setItem('cfg_guest_pwd', val);
            alert("Guest password updated successfully.");
        }

        function saveAdminCreds() {
            const usr = document.getElementById('set_a_usr').value.trim();
            const pwd = document.getElementById('set_a_pwd').value.trim();
            if (!usr) { alert("Admin ID cannot be empty"); return; }
            localStorage.setItem('cfg_admin_usr', usr);
            if (pwd) localStorage.setItem('cfg_admin_pwd', pwd);
            alert("Admin profile updated successfully.");
        }

        function doLogout() {
            localStorage.removeItem('sone_role');
            localStorage.removeItem('sone_user');
            loadAuthScreen();
        }

        function systemHardReset() {
            if (confirm("Reset local system data?")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
    </body>
    </html>
